<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Survival Hub</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

        }


        /* MAIN APP */

        .phone {

            width: 100%;
            max-width: 430px;

            height: min(850px, 95vh);

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(25px);

            border-radius: 35px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6);

            overflow: hidden;

            display: flex;
            flex-direction: column;

            border: 1px solid rgba(255, 255, 255, 0.2);

            color: white;

        }


        /* HEADER */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            padding: 18px 20px;

            display: flex;

            align-items: center;

            gap: 14px;

        }


        .back {

            font-size: 22px;

            cursor: pointer;

            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            transition: 0.2s;

        }


        .back:hover {

            background: rgba(255, 255, 255, 0.2);

        }


        .header h2 {

            font-size: 20px;

            font-weight: 600;

        }


        /* CONTENT */

        .content {

            flex: 1;

            overflow-y: auto;

            padding: 25px 20px;

        }


        /* PROFILE ICON */

        .profile-icon {

            width: 90px;
            height: 90px;

            margin: 5px auto 18px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff
                );

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 42px;

            box-shadow:
                0 10px 30px rgba(0, 114, 255, 0.35);

        }


        .title {

            text-align: center;

            font-size: 22px;

            font-weight: 600;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            font-size: 12px;

            opacity: 0.7;

            margin-bottom: 25px;

        }


        /* FORM */

        .form-group {

            margin-bottom: 17px;

        }


        .form-group label {

            display: block;

            font-size: 12px;

            margin-bottom: 7px;

            opacity: 0.85;

        }


        .input-box {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 14px;

            outline: none;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 13px;

            transition: 0.25s;

        }


        .input-box::placeholder {

            color: rgba(255, 255, 255, 0.55);

        }


        .input-box:focus {

            border-color: rgba(0, 198, 255, 0.8);

            background: rgba(255, 255, 255, 0.16);

            box-shadow:
                0 0 0 3px rgba(0, 198, 255, 0.12);

        }


        /* SAVE BUTTON */

        .save-btn {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff
                );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 8px 25px rgba(0, 114, 255, 0.3);

        }


        .save-btn:hover {

            transform: translateY(-2px);

        }


        .save-btn:active {

            transform: scale(0.97);

        }


        /* MESSAGE */

        #msg {

            text-align: center;

            font-size: 12px;

            margin-top: 15px;

            min-height: 18px;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            font-size: 11px;

            padding: 10px;

            opacity: 0.7;

            border-top:
                1px solid rgba(255, 255, 255, 0.08);

        }


        /* SMALL PHONES */

        @media (max-width: 380px) {

            body {

                padding: 0;

            }


            .phone {

                width: 100%;

                height: 100vh;

                min-height: 100vh;

                border-radius: 0;

                border: none;

            }


            .header {

                padding: 16px;

            }


            .content {

                padding: 20px 16px;

            }

        }

    </style>

</head>


<body>


    <div class="phone">


        <!-- HEADER -->

        <div class="header">

            <div
                class="back"
                onclick="history.back()"
            >
                ⬅
            </div>

            <h2>👤 My Profile</h2>

        </div>


        <!-- CONTENT -->

        <div class="content">


            <div class="profile-icon">
                👤
            </div>


            <div class="title">
                Create Your Profile
            </div>


            <div class="subtitle">
                Keep your information safe and accessible
            </div>


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    👤 Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    class="input-box"
                    placeholder="Enter your name"
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    📱 Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    class="input-box"
                    placeholder="Enter phone number"
                >

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="location">
                    📍 Location
                </label>

                <input
                    type="text"
                    id="location"
                    class="input-box"
                    placeholder="Enter location"
                >

            </div>


            <!-- SAVE -->

            <button
                class="save-btn"
                onclick="saveProfile()"
            >
                💾 Save Profile
            </button>


            <p id="msg"></p>


        </div>


        <!-- FOOTER -->

        <div class="footer">
            Survival Hub • Smart Assistance for Everyone
        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script>

        async function saveProfile() {

            let name =
                document.getElementById("name").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let location =
                document.getElementById("location").value.trim();


            if (
                name === "" ||
                phone === "" ||
                location === ""
            ) {

                alert("Please fill all fields");

                return;

            }


            try {

                const response = await fetch("/profile", {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        name: name,

                        phone: phone,

                        location: location

                    })

                });


                const result =
                    await response.json();


                if (result.success) {

                    document.getElementById("msg").innerText =
                        "✔ Profile saved successfully";

                }

                else {

                    document.getElementById("msg").innerText =
                        "❌ " + result.message;

                }


            }

            catch (error) {

                console.error(error);

                document.getElementById("msg").innerText =
                    "❌ Unable to connect to server";

            }

        }

    </script>


</body>

</html>
