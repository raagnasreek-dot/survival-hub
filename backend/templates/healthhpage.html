<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Opportunities</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            background: linear-gradient(135deg, #141e30, #243b55);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            padding: 20px;

            overflow: hidden;
        }


        /* PHONE FRAME */

        .phone {

            width: 380px;
            height: 760px;
            max-width: 100%;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(25px);

            border-radius: 40px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6);

            overflow: hidden;

            display: flex;
            flex-direction: column;

            border:
                1px solid rgba(255, 255, 255, 0.2);

            color: white;
        }


        /* HEADER */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #007bff,
                    #4dabf7
                );

            padding: 20px;

            display: flex;
            align-items: center;

            gap: 12px;

            flex-shrink: 0;
        }


        .back {

            font-size: 22px;

            cursor: pointer;

            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            transition: 0.2s;

            flex-shrink: 0;
        }


        .back:hover {

            background:
                rgba(255, 255, 255, 0.2);
        }


        .header h2 {

            font-size: 20px;

            line-height: 1.3;
        }


        /* SEARCH BAR */

        .search {

            padding: 15px;

            flex-shrink: 0;
        }


        .search input {

            width: 100%;

            padding: 11px 13px;

            border-radius: 10px;

            border: none;

            outline: none;

            font-size: 14px;

            min-height: 42px;
        }


        /* CONTENT */

        .content {

            flex: 1;

            overflow-y: auto;

            overflow-x: hidden;

            padding: 15px;

            -webkit-overflow-scrolling: touch;
        }


        .content::-webkit-scrollbar {

            width: 5px;
        }


        .content::-webkit-scrollbar-thumb {

            background:
                rgba(255, 255, 255, 0.25);

            border-radius: 10px;
        }


        /* SECTION TITLE */

        .section-title {

            font-size: 15px;

            margin-bottom: 12px;

            opacity: 0.9;

            font-weight: 500;
        }


        /* JOB CARD */

        .card {

            background:
                rgba(255, 255, 255, 0.12);

            padding: 18px;

            border-radius: 18px;

            margin-bottom: 15px;

            transition: 0.3s;

            border:
                1px solid rgba(255, 255, 255, 0.06);

            width: 100%;

            overflow-wrap: anywhere;
        }


        .card:hover {

            background:
                rgba(255, 255, 255, 0.2);

            transform:
                translateY(-4px);
        }


        .card h3 {

            font-size: 15px;

            margin-bottom: 6px;

            line-height: 1.4;
        }


        .company {

            font-size: 12px;

            margin-bottom: 5px;

            opacity: 0.9;

            line-height: 1.5;
        }


        .location {

            font-size: 12px;

            opacity: 0.85;

            margin-bottom: 10px;

            line-height: 1.5;
        }


        .contact {

            font-size: 11px;

            opacity: 0.75;

            margin-bottom: 12px;

            line-height: 1.5;
        }


        /* BUTTON */

        .btn {

            background:
                linear-gradient(
                    135deg,
                    #ff512f,
                    #dd2476
                );

            border: none;

            color: white;

            padding: 8px 15px;

            border-radius: 10px;

            font-size: 12px;

            cursor: pointer;

            transition: 0.2s;

            min-height: 34px;
        }


        .btn:hover {

            transform: scale(1.05);
        }


        .btn:active {

            transform: scale(0.96);
        }


        /* NO DATA */

        .no-data {

            text-align: center;

            padding: 40px 20px;

            font-size: 13px;

            opacity: 0.75;

            line-height: 1.5;
        }


        /* MOBILE */

        @media (max-width: 400px) {

            body {

                padding: 0;

                min-height: 100vh;

                width: 100%;

                background: #141e30;
            }


            .phone {

                width: 100%;

                max-width: none;

                height: 100vh;

                min-height: 100vh;

                border-radius: 0;

                border: none;

                box-shadow: none;
            }


            .header {

                padding: 17px 16px;
            }


            .back {

                width: 34px;
                height: 34px;

                font-size: 21px;
            }


            .header h2 {

                font-size: 18px;
            }


            .search {

                padding: 12px;
            }


            .search input {

                padding: 11px 12px;

                font-size: 13px;

                min-height: 42px;
            }


            .content {

                padding: 14px 12px;

                overflow-y: auto;

                overflow-x: hidden;
            }


            .section-title {

                font-size: 14px;

                margin-bottom: 10px;
            }


            .card {

                padding: 15px;

                border-radius: 15px;

                margin-bottom: 12px;
            }


            .card h3 {

                font-size: 14px;

                margin-bottom: 6px;
            }


            .company,
            .location {

                font-size: 11px;
            }


            .contact {

                font-size: 10.5px;

                margin-bottom: 10px;
            }


            .btn {

                padding: 8px 13px;

                font-size: 11px;

                min-height: 34px;
            }
        }


        /* EXTRA SMALL PHONES */

        @media (max-width: 340px) {

            .header {

                padding: 15px 13px;
            }


            .header h2 {

                font-size: 17px;
            }


            .search {

                padding: 10px;
            }


            .content {

                padding: 12px 10px;
            }


            .card {

                padding: 13px;

                border-radius: 14px;
            }


            .card h3 {

                font-size: 13px;
            }


            .company,
            .location {

                font-size: 10.5px;
            }


            .btn {

                font-size: 10.5px;

                padding: 7px 11px;
            }
        }

    </style>

</head>


<body>


    <div class="phone">


        <!-- HEADER -->

        <div class="header">

            <div
                class="back"
                onclick="goBack()"
                aria-label="Go back"
            >
                ⬅
            </div>

            <h2>💼 Job Opportunities</h2>

        </div>


        <!-- SEARCH -->

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search jobs..."
                oninput="searchJobs()"
            >

        </div>


        <!-- JOB LIST -->

        <div
            class="content"
            id="jobList"
        >

            <div class="section-title">
                💼 Available Jobs
            </div>


            {% if jobs %}

                {% for job in jobs %}

                    <div class="card">

                        <h3>
                            {{ job.job_title }}
                        </h3>


                        <div class="company">
                            🏢 {{ job.company }}
                        </div>


                        <div class="location">
                            📍 {{ job.location }}
                        </div>


                        {% if job.contact %}

                            <div class="contact">
                                📞 {{ job.contact }}
                            </div>


                            <button
                                type="button"
                                class="btn"
                                data-contact="{{ job.contact }}"
                                onclick="contactJob(this)"
                            >
                                📞 Contact
                            </button>

                        {% endif %}

                    </div>

                {% endfor %}


            {% else %}

                <div class="no-data">

                    💼 No job opportunities available right now.

                </div>

            {% endif %}


        </div>


    </div>


    <script>


        /* BACK BUTTON */

        function goBack() {

            window.history.back();

        }


        /* SEARCH JOBS */

        function searchJobs() {

            const input =
                document
                    .getElementById("searchInput")
                    .value
                    .trim()
                    .toLowerCase();


            const cards =
                document.querySelectorAll(".card");


            cards.forEach(function(card) {

                const jobNameElement =
                    card.querySelector("h3");


                const locationElement =
                    card.querySelector(".location");


                const companyElement =
                    card.querySelector(".company");


                const jobName =
                    jobNameElement
                        ? jobNameElement.innerText.toLowerCase()
                        : "";


                const location =
                    locationElement
                        ? locationElement.innerText.toLowerCase()
                        : "";


                const company =
                    companyElement
                        ? companyElement.innerText.toLowerCase()
                        : "";


                const matches =

                    jobName.includes(input) ||

                    location.includes(input) ||

                    company.includes(input);


                card.style.display =
                    matches ? "block" : "none";

            });

        }


        /* CONTACT JOB */

        function contactJob(button) {

            const number =
                button.dataset.contact;


            if (!number) {

                alert("Contact number is not available.");

                return;

            }


            window.location.href =
                "tel:" + number;

        }

    </script>


</body>

</html>
