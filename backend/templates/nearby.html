<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nearby Services | Survival Hub</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    background:
        linear-gradient(
            135deg,
            #141e30,
            #243b55
        );

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;
}


/* PHONE FRAME */

.phone{

    width:380px;

    max-width:100%;

    height:760px;

    max-height:95vh;

    background:
        rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);

    border-radius:40px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.6);

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,0.2);

    color:white;

    display:flex;

    flex-direction:column;
}


/* HEADER */

.header{

    padding:20px 20px 5px;

    font-size:24px;

    font-weight:600;

    flex-shrink:0;
}


.sub{

    padding:0 20px 20px;

    font-size:14px;

    opacity:0.8;

    flex-shrink:0;
}


/* CONTENT */

.content{

    flex:1;

    overflow-y:auto;

    padding:0 20px 20px;

    -webkit-overflow-scrolling:touch;
}


.content::-webkit-scrollbar{

    width:5px;
}


.content::-webkit-scrollbar-thumb{

    background:
        rgba(255,255,255,0.3);

    border-radius:10px;
}


/* CARD */

.card{

    background:
        rgba(255,255,255,0.12);

    padding:18px;

    margin-bottom:15px;

    border-radius:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    transition:0.3s;

    border:
        1px solid rgba(255,255,255,0.06);
}


.card:hover{

    transform:translateY(-3px);

    background:
        rgba(255,255,255,0.18);
}


.card-info{

    min-width:0;

    flex:1;

    font-size:14px;

    line-height:1.5;
}


small{

    opacity:0.7;

    font-size:11px;

    word-break:break-word;
}


/* MAP BUTTON */

.map-btn{

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    padding:8px 14px;

    border-radius:10px;

    font-size:12px;

    color:white;

    text-decoration:none;

    flex-shrink:0;

    transition:0.2s;

    white-space:nowrap;

    -webkit-tap-highlight-color:transparent;
}


.map-btn:hover{

    transform:scale(1.05);
}


.map-btn:active{

    transform:scale(0.96);
}


/* BOTTOM NAV */

.nav{

    height:65px;

    background:
        rgba(255,255,255,0.95);

    display:flex;

    justify-content:space-around;

    align-items:center;

    color:#333;

    flex-shrink:0;

    padding-bottom:env(safe-area-inset-bottom);
}


.nav div{

    text-align:center;

    font-size:12px;

    cursor:pointer;

    transition:0.2s;

    min-width:50px;

    -webkit-tap-highlight-color:transparent;
}


.nav div:hover{

    color:#0072ff;

    transform:translateY(-2px);
}


/* MOBILE */

@media(max-width:600px){

    body{

        background:#f8fafc;

        padding:0;

        align-items:stretch;
    }


    .phone{

        width:100%;

        max-width:none;

        height:100vh;

        max-height:none;

        min-height:100vh;

        border-radius:0;

        border:none;

        box-shadow:none;
    }


    .header{

        padding:18px 16px 5px;

        font-size:22px;
    }


    .sub{

        padding:
            0
            16px
            17px;

        font-size:13px;
    }


    .content{

        padding:
            0
            16px
            16px;
    }


    .card{

        padding:15px;

        margin-bottom:12px;

        border-radius:16px;

        gap:10px;
    }


    .card-info{

        font-size:13px;
    }


    small{

        font-size:10.5px;
    }


    .map-btn{

        padding:8px 11px;

        font-size:11px;
    }


    .nav{

        height:64px;
    }


    .nav div{

        font-size:11px;

        min-width:48px;
    }

}


/* SMALL PHONES */

@media(max-width:380px){

    .header{

        padding-left:14px;

        padding-right:14px;

        font-size:20px;
    }


    .sub{

        padding-left:14px;

        padding-right:14px;

        font-size:12px;
    }


    .content{

        padding-left:14px;

        padding-right:14px;
    }


    .card{

        padding:13px;

        gap:8px;
    }


    .card-info{

        font-size:12px;
    }


    small{

        font-size:10px;
    }


    .map-btn{

        padding:7px 9px;

        font-size:10px;
    }


    .nav div{

        font-size:10px;

        min-width:44px;
    }

}


/* VERY SMALL PHONES */

@media(max-width:320px){

    .card{

        align-items:flex-start;
    }


    .map-btn{

        padding:7px 8px;

        font-size:9.5px;
    }


    .card-info{

        font-size:11px;
    }

}

</style>

</head>


<body>

    </a>

</div>


</div>


<!-- BOTTOM NAV -->

<div class="nav">


<div onclick="location.href='/'">

    🏠<br>
    Home

</div>


<div onclick="location.href='/health-page'">

    🏥<br>

</div>

</div>


</div>


</body>

</html>
