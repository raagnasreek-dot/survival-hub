<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Profile | Survival Hub</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    background:
        linear-gradient(
            135deg,
            #141e30,
            #243b55
        );

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;
}


/* PHONE FRAME */

.phone{

    width:380px;

    max-width:100%;

    height:760px;

    max-height:95vh;

    background:
        rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);

    border-radius:40px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.6);

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,0.2);

    color:white;

    display:flex;

    flex-direction:column;
}


/* STATUS BAR */

.status{

    height:28px;

    min-height:28px;

    background:#0f172a;

    color:white;

    font-size:11px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 15px;

    flex-shrink:0;
}


/* HEADER */

.header{

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    padding:18px 20px;

    display:flex;

    align-items:center;

    gap:10px;

    flex-shrink:0;
}


.back{

    cursor:pointer;

    font-size:22px;

    width:34px;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    transition:0.2s;
}


.back:hover{

    background:
        rgba(255,255,255,0.2);
}


.header h2{

    font-size:20px;

    font-weight:600;
}


/* CONTENT */

.content{

    flex:1;

    overflow-y:auto;

    padding:25px 20px;

    -webkit-overflow-scrolling:touch;
}


.content::-webkit-scrollbar{

    width:5px;
}


.content::-webkit-scrollbar-thumb{

    background:
        rgba(255,255,255,0.3);

    border-radius:10px;
}


/* PROFILE ICON */

.profile-icon{

    width:90px;

    height:90px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:45px;

    margin:5px auto 25px;

    box-shadow:
        0 10px 30px rgba(0,114,255,0.35);
}


/* FORM CARD */

.profile-card{

    background:
        rgba(255,255,255,0.12);

    padding:20px;

    border-radius:20px;

    margin-bottom:20px;

    border:
        1px solid rgba(255,255,255,0.06);
}


.profile-card h3{

    font-size:17px;

    margin-bottom:18px;
}


/* INPUT GROUP */

.input-group{

    margin-bottom:15px;
}


.input-group label{

    display:block;

    font-size:12px;

    margin-bottom:7px;

    opacity:0.8;
}


.input-group input{

    width:100%;

    padding:12px 14px;

    border:none;

    outline:none;

    border-radius:12px;

    background:
        rgba(255,255,255,0.9);

    color:#222;

    font-size:13px;

    transition:0.2s;
}


.input-group input:focus{

    box-shadow:
        0 0 0 2px #00c6ff;
}


/* SAVE BUTTON */

.save-btn{

    width:100%;

    border:none;

    padding:13px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff512f,
            #dd2476
        );

    color:white;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

    -webkit-tap-highlight-color:transparent;
}


.save-btn:hover{

    transform:scale(1.02);

    opacity:0.95;
}


.save-btn:active{

    transform:scale(0.98);
}


/* MESSAGE */

#msg{

    text-align:center;

    font-size:13px;

    margin-top:15px;

    min-height:20px;

    line-height:1.4;
}


/* BOTTOM NAV */

.nav{

    height:65px;

    min-height:65px;

    background:
        rgba(255,255,255,0.95);

    display:flex;

    justify-content:space-around;

    align-items:center;

    border-top:
        1px solid rgba(255,255,255,0.3);

    color:#333;

    flex-shrink:0;

    padding-bottom:env(safe-area-inset-bottom);
}


.nav div{

    text-align:center;

    font-size:12px;

    cursor:pointer;

    transition:0.2s;

    min-width:50px;

    -webkit-tap-highlight-color:transparent;
}


.nav div:hover{

    color:#0072ff;

    transform:translateY(-2px);
}


/* MOBILE */

@media(max-width:600px){

    body{

        background:#f8fafc;

        padding:0;

        align-items:stretch;
    }


    .phone{

        width:100%;

        max-width:none;

        height:100vh;

        max-height:none;

        min-height:100vh;

        border-radius:0;

        border:none;

        box-shadow:none;
    }


    .status{

        padding:0 14px;
    }


    .header{

        padding:16px;
    }


    .header h2{

        font-size:18px;
    }


    .content{

        padding:22px 16px;
    }


    .profile-icon{

        width:82px;

        height:82px;

        font-size:40px;

        margin-bottom:22px;
    }


    .profile-card{

        padding:17px;

        border-radius:17px;
    }


    .profile-card h3{

        font-size:16px;

        margin-bottom:16px;
    }


    .input-group{

        margin-bottom:13px;
    }


    .input-group label{

        font-size:11px;
    }


    .input-group input{

        padding:11px 12px;

        font-size:12px;
    }


    .save-btn{

        padding:12px;

        font-size:13px;
    }


    #msg{

        font-size:12px;
    }


    .nav{

        height:64px;

        min-height:64px;
    }


    .nav div{

        font-size:11px;

        min-width:48px;
    }

}


/* SMALL PHONES */

@media(max-width:380px){

    .header{

        padding:14px;
    }


    .header h2{

        font-size:17px;
    }


    .content{

        padding:18px 14px;
    }


    .profile-icon{

        width:76px;

        height:76px;

        font-size:37px;

        margin-bottom:18px;
    }


    .profile-card{

        padding:15px;
    }


    .profile-card h3{

        font-size:15px;
    }


    .input-group input{

        padding:10px;

        font-size:11px;
    }


    .save-btn{

        padding:11px;

        font-size:12px;
    }


    .nav div{

        font-size:10px;

        min-width:44px;
    }

}


/* VERY SMALL PHONES */

@media(max-width:320px){

    .content{

        padding:15px 12px;
    }


    .profile-icon{

        width:70px;

        height:70px;

        font-size:34px;
    }


    .profile-card{

        padding:13px;
    }


    .input-group{

        margin-bottom:11px;
    }


    .input-group input{

        padding:9px;

        font-size:10.5px;
    }


    .save-btn{

        padding:10px;

        font-size:11px;
    }

}

</style>

</head>


<body>


<div class="phone">


<!-- STATUS BAR -->

<div class="status">

    <div id="time">14:32</div>

    <div>📶 5G 🔋92%</div>

</div>


<!-- HEADER -->

<div class="header">

    <div
        class="back"
        onclick="history.back()"
    >
        ⬅
    </div>

    <h2>👤 My Profile</h2>

</div>


<!-- CONTENT -->

<div class="content">


<div class="profile-icon">

    👤

</div>


<div class="profile-card">

    <h3>Personal Information</h3>


    <div class="input-group">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

    </div>


    <div class="input-group">

        <label for="phone">
            Phone Number
        </label>

        <input
            type="text"
            id="phone"
            placeholder="Enter phone number"
        >

    </div>


    <div class="input-group">

        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            placeholder="Enter location"
        >

    </div>


    <button
        class="save-btn"
        onclick="saveProfile()"
    >
        💾 Save Profile
    </button>


    <p id="msg"></p>

</div>


</div>


<!-- BOTTOM NAV -->

<div class="nav">


<div onclick="location.href='/'">

    🏠<br>
    Home

</div>


<div onclick="location.href='/nearby'">

    📍<br>
    Nearby

</div>


<div onclick="location.href='/health-page'">

    🏥<br>
    Health

</div>


<div onclick="location.href='/schemes-page'">

    🏛<br>
    Schemes

</div>


</div>


</div>


<script>


/* SAVE PROFILE */

async function saveProfile(){

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let location =
        document.getElementById("location").value.trim();


    if(
        name === "" ||
        phone === "" ||
        location === ""
    ){

        document.getElementById("msg").innerText =
            "⚠️ Please fill all fields";

        return;
    }


    try{

        const response =
            await fetch("/profile",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    name:name,

                    phone:phone,

                    location:location

                })

            });


        const result =
            await response.json();


        if(result.success){

            document.getElementById("msg").innerText =
                "✔ Profile saved successfully";

        }
        else{

            document.getElementById("msg").innerText =
                "❌ " + (result.message || "Unable to save profile");

        }

    }
    catch(error){

        console.error(error);

        document.getElementById("msg").innerText =
            "❌ Unable to connect to server";

    }

}


/* LIVE TIME */

function updateTime(){

    const now = new Date();

    let hours =
        String(now.getHours()).padStart(2,"0");

    let minutes =
        String(now.getMinutes()).padStart(2,"0");


    document.getElementById("time").innerText =
        hours + ":" + minutes;

}


updateTime();

setInterval(updateTime,30000);


</script>


</body>

</html>
