<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survival Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#141e30,#243b55);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* PHONE FRAME */

.phone{
width:380px;
height:760px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
border-radius:40px;
box-shadow:0 30px 80px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.2);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

/* LOGO */

.logo{
width:90px;
height:90px;
border-radius:50%;
background:linear-gradient(135deg,#00c6ff,#0072ff);
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
margin-bottom:20px;
animation:pop 1.2s ease;
}

/* TITLE */

.title{
font-size:28px;
font-weight:600;
letter-spacing:1px;
animation:fade 2s;
}

.subtitle{
font-size:14px;
opacity:0.85;
margin-top:10px;
animation:fade 3s;
}

/* ANIMATIONS */

@keyframes pop{
0%{transform:scale(0)}
100%{transform:scale(1)}
}

@keyframes fade{
0%{opacity:0}
100%{opacity:1}
}

</style>
</head>

<body>

<div class="phone">

<div class="logo">🌐</div>

<div class="title">Survival Hub</div>

<div class="subtitle">One App for Every Need</div>

</div>

<script>

/* Redirect to main page after 3 seconds */

setTimeout(function(){
window.location.href="main.html";
},3000);

</script>

</body>
</html>
